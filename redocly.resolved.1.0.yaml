openapi: 3.0.3
info:
  version: '1.0'
  title: Self Assessment Test Support (MTD)
  description: |
    # Changelog
    The changelog is [available here](https://github.com/hmrc/income-tax-mtd-changelog/#readme).

    # Support

    * Direct reports of bugs or errors in Production or Sandbox code, or queries about HMRC business functionality (such as how a specific field is used by HMRC or why it is needed) to the [Software Development Support Team (SDST)](https://developer.service.hmrc.gov.uk/developer/support).
    * Send queries or feedback related to the design of the APIs (including recommended changes) using the [income-tax-mtd-changelog](https://github.com/hmrc/income-tax-mtd-changelog/issues) GitHub page.
    * <a href="/contact/report-technical-problem?newTab=true&service=api-documentation-frontend" target="_blank">Is this page not working properly? (opens in new tab)</a>
servers:
  - url: https://test-api.service.hmrc.gov.uk
    description: Sandbox
paths:
  /individuals/self-assessment-test-support/vendor-state:
    delete:
      summary: Delete Stateful Test Data
      security:
        - User-Restricted:
            - write:self-assessment
      parameters:
        - in: query
          name: nino
          description: |
            National Insurance number, in the format `AA999999A`. 

            If supplied, the endpoint deletes only stateful test data stored against the vendor that is associated with the specified National Insurance number.
          schema:
            type: string
            example: TC663795B
        - name: Accept
          in: header
          description: |
            Specifies the response format and the version of the API to be used.
          schema: &ref_3
            type: string
            enum:
              - application/vnd.hmrc.1.0+json
          required: true
        - name: Authorization
          in: header
          description: |
            An OAuth 2.0 Bearer Token with the *write:self-assessment* scope.
          schema: &ref_4
            type: string
            example: Bearer bb7fed3fe10dd235a2ccda3d50fb
          required: true
      description: |
        This endpoint allows a developer to delete stateful test data supplied by them in the sandbox environment.
        When the endpoint is called, all stateful test data stored against the vendor is deleted from the sandbox database.
        Any stateful test data that has not been deleted by the developer is automatically deleted from database 7 days after 
        its creation.
      responses:
        '204':
          description: Success
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: &ref_0
                type: string
                example: c75f40a6-a3df-4429-a697-471eeec46435
              required: true
        '403':
          description: Forbidden
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: &ref_1
                  code:
                    description: The error code
                    type: string
                  message:
                    description: The error message
                    type: string
                required: &ref_2
                  - code
              examples:
                CLIENT_OR_AGENT_NOT_AUTHORISED:
                  description: |
                    The client and/or agent is not authorised. This is normally because: the client is not subscribed to MTD, 
                    the agent is not subscribed to Agent Services, or the client has not authorised the agent to act on their behalf.
                  value: &ref_5
                    code: CLIENT_OR_AGENT_NOT_AUTHORISED
                    message: The client and/or agent is not authorised
        '404':
          description: Not Found
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                MATCHING_RESOURCE_NOT_FOUND:
                  description: The remote endpoint has indicated that no data can be found for the given vendor.
                  value: &ref_11
                    code: MATCHING_RESOURCE_NOT_FOUND
                    message: Matching resource not found
  /individuals/self-assessment-test-support/vendor-state/checkpoints:
    get:
      summary: List Checkpoints
      security:
        - User-Restricted:
            - read:self-assessment
      description: |
        This endpoint enables you to get all the checkpoints created for the vendor ID. 
        A National Insurance number can be provided to filter the results based on National Insurance number.
      tags:
        - Checkpoint for Vendor Data
      parameters:
        - name: Accept
          in: header
          description: |
            Specifies the response format and the version of the API to be used.
          schema: *ref_3
          required: true
        - name: Authorization
          in: header
          description: |
            An OAuth 2.0 Bearer Token with the *write:self-assessment* scope.
          schema: *ref_4
          required: true
        - in: query
          name: nino
          description: |
            National Insurance number, in the format `AA999999A`.
          schema:
            type: string
            example: TC663795B
      responses:
        '200':
          description: Success
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                $schema: http://json-schema.org/draft-04/schema#
                title: List checkpoints
                type: object
                properties:
                  checkpoints:
                    type: array
                    description: The array holding all the checkpoint details.
                    items:
                      type: object
                      properties:
                        checkpointId:
                          type: string
                          description: The unique identifier of the checkpoint.
                          pattern: ^[A-Za-z0-9]{36}$
                          example: a1e8057e-fbbc-47a8-a8b4-78d9f015c253
                        checkpointCreationTimestamp:
                          type: string
                          description: 'The timestamp of when the checkpoint was created in ISO 8601 UTC format: `YYYY-MM-DDThh:mm:ss.SSSZ`.'
                          example: ' 2019-07-13T07:51:43.112Z'
                      required:
                        - checkpointId
                        - checkpointCreationTimestamp
                additionalProperties: false
              examples:
                example-response:
                  description: Example Response
                  value:
                    $ref: ./examples/checkpoints/list_response.json
        '400':
          description: Bad Request
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                FORMAT_NINO:
                  description: The format of the supplied NINO is not valid.
                  value: &ref_6
                    code: FORMAT_NINO
                    message: The provided NINO is invalid
        '403':
          description: Forbidden
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                CLIENT_OR_AGENT_NOT_AUTHORISED:
                  description: |
                    The client and/or agent is not authorised. This is normally because: the client is not subscribed to MTD, 
                    the agent is not subscribed to Agent Services, or the client has not authorised the agent to act on their behalf.
                  value: *ref_5
    post:
      summary: Create a Checkpoint
      security:
        - User-Restricted:
            - write:self-assessment
      description: |
        This endpoint enables you to set up a checkpoint for the stateful data in the sandbox environment for a given National Insurance number.

        A National Insurance number must be provided.

        You can reset the data back to the checkpoint created using the 'Restore to Checkpoint' endpoint.

        **Note**: To prevent data loss or unexpected behaviour, the checkpoint restore should not be performed while any other stateful or checkpoint operations are in progress for the same National Insurance number.
      tags:
        - Checkpoint for Vendor Data
      parameters:
        - in: query
          required: true
          name: nino
          description: |
            National Insurance number, in the format `AA999999A`.
          schema:
            type: string
            example: TC663795B
        - name: Accept
          in: header
          description: |
            Specifies the response format and the version of the API to be used.
          schema: *ref_3
          required: true
        - name: Authorization
          in: header
          description: |
            An OAuth 2.0 Bearer Token with the *write:self-assessment* scope.
          schema: *ref_4
          required: true
      responses:
        '201':
          description: Success
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                $schema: http://json-schema.org/draft-04/schema#
                title: Create a checkpoint
                type: object
                properties:
                  checkpointId:
                    type: string
                    description: The unique identifier of the checkpoint.
                    pattern: ^[A-Za-z0-9\-]{36}$
                additionalProperties: false
              examples:
                example-response:
                  description: Example Response
                  value:
                    $ref: ./examples/checkpoints/create_response.json
        '400':
          description: Bad Request
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                FORMAT_NINO:
                  description: The format of the supplied NINO is not valid.
                  value: *ref_6
        '403':
          description: Forbidden
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                CLIENT_OR_AGENT_NOT_AUTHORISED:
                  description: |
                    The client and/or agent is not authorised. This is normally because: the client is not subscribed to MTD, 
                    the agent is not subscribed to Agent Services, or the client has not authorised the agent to act on their behalf.
                  value: *ref_5
        '404':
          description: Not Found
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                MATCHING_RESOURCE_NOT_FOUND:
                  description: No records were found for the passed NINO to create a checkpoint.
                  value:
                    code: MATCHING_RESOURCE_NOT_FOUND
                    message: Matching resource not found
  /individuals/self-assessment-test-support/vendor-state/checkpoints/{checkpointId}:
    delete:
      summary: Delete a Checkpoint
      description: |
        This endpoint enables you to delete a checkpoint created in the sandbox, specified with a ‘checkpointId’.

        Any checkpoint that is not deleted is automatically removed from the database 7 days after its creation.

        Checkpoints can only be deleted with this endpoint. Deleting data with the Delete Stateful Test Data endpoint will not delete checkpoints.

        **Note**: To prevent data loss or unexpected behaviour, the checkpoint delete should not be performed while other stateful checkpoint operations are in progress for the same National Insurance number.
      tags:
        - Checkpoint for Vendor Data
      security:
        - User-Restricted:
            - write:self-assessment
      parameters:
        - name: Accept
          in: header
          description: |
            Specifies the response format and the version of the API to be used.
          schema: *ref_3
          required: true
        - name: Authorization
          in: header
          description: |
            An OAuth 2.0 Bearer Token with the *write:self-assessment* scope.
          schema: *ref_4
          required: true
        - in: path
          name: checkpointId
          required: true
          description: |
            The unique identifier of the checkpoint returned by the 'Create a checkpoint' endpoint. Format: ^[A-Za-z0-9\-]{36}$
          schema: &ref_7
            type: string
            example: a1e8057e-fbbc-47a8-a8b4-78d9f015c253
      responses:
        '204':
          description: Success
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
        '400':
          description: Bad Request
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                FORMAT_CHECKPOINT_ID:
                  description: The format of the supplied Checkpoint ID field is not valid.
                  value: &ref_8
                    code: FORMAT_CHECKPOINT_ID
                    message: The provided checkpoint ID is invalid
        '403':
          description: Forbidden
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                CLIENT_OR_AGENT_NOT_AUTHORISED:
                  description: |
                    The client and/or agent is not authorised. This is normally because: the client is not subscribed to MTD, 
                    the agent is not subscribed to Agent Services, or the client has not authorised the agent to act on their behalf.
                  value: *ref_5
        '404':
          description: Not Found
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                MATCHING_RESOURCE_NOT_FOUND:
                  description: No checkpoint found for the passed Checkpoint ID.
                  value: &ref_9
                    code: MATCHING_RESOURCE_NOT_FOUND
                    message: Matching resource not found
  /individuals/self-assessment-test-support/vendor-state/checkpoints/{checkpointId}/restore:
    post:
      summary: Restore to Checkpoint
      description: |
        This endpoint enables you to reset the stateful data back to the checkpoint created in the sandbox environment.

        A valid checkpoint ID must be provided.

        When you restore the checkpoint, the modified date of the data will be updated to the restored date.

        **Note**: To prevent data loss or unexpected behaviour, the checkpoint restore should not be performed while any other stateful or checkpoint operations are in progress for the same National Insurance number.
      tags:
        - Checkpoint for Vendor Data
      security:
        - User-Restricted:
            - write:self-assessment
      parameters:
        - name: Accept
          in: header
          description: |
            Specifies the response format and the version of the API to be used.
          schema: *ref_3
          required: true
        - name: Authorization
          in: header
          description: |
            An OAuth 2.0 Bearer Token with the *write:self-assessment* scope.
          schema: *ref_4
          required: true
        - in: path
          name: checkpointId
          required: true
          description: |
            The unique identifier of the checkpoint returned by the 'Create a checkpoint' endpoint. Format: ^[A-Za-z0-9\-]{36}$
          schema: *ref_7
      responses:
        '201':
          description: Success
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
        '400':
          description: Bad Request
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                FORMAT_CHECKPOINT_ID:
                  description: The format of the supplied Checkpoint ID field is not valid.
                  value: *ref_8
        '403':
          description: Forbidden
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                CLIENT_OR_AGENT_NOT_AUTHORISED:
                  description: |
                    The client and/or agent is not authorised. This is normally because: the client is not subscribed to MTD, 
                    the agent is not subscribed to Agent Services, or the client has not authorised the agent to act on their behalf.
                  value: *ref_5
        '404':
          description: Not Found
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                MATCHING_RESOURCE_NOT_FOUND:
                  description: No checkpoint found for the passed Checkpoint ID.
                  value: *ref_9
  /individuals/self-assessment-test-support/business/{nino}:
    post:
      summary: Create a Test Business
      description: |
        This endpoint enables you to create a test business for use within the Sandbox environment.

        Customers may have multiple Self-Employment businesses, but only one of each Property business is allowed. 
        MTD supports only one accounting period per year so this must be a full tax year period, for example April 6th to April 5th. 
        Test businesses are automatically purged from the database 7 days after creation.
      tags:
        - Business Income Source
      parameters:
        - name: nino
          in: path
          description: |
            National Insurance number.
          schema: &ref_10
            type: string
            pattern: ^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]$
            example: TC663795B
          required: true
        - name: Accept
          in: header
          description: |
            Specifies the response format and the version of the API to be used.
          schema: *ref_3
          required: true
        - name: Authorization
          in: header
          description: |
            An OAuth 2.0 Bearer Token with the *write:self-assessment* scope.
          schema: *ref_4
          required: true
      security:
        - User-Restricted:
            - write:self-assessment
      requestBody:
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-04/schema#
              title: Create a Test Business
              type: object
              properties:
                typeOfBusiness:
                  type: string
                  description: The type of business income source.
                  enum:
                    - self-employment
                    - uk-property
                    - foreign-property
                    - property-unspecified
                tradingName:
                  type: string
                  description: |-
                    The trading name of the business.

                    Forbidden for property businesses.

                    Mandatory for self-employment businesses.
                  example: ABC Ltd.
                firstAccountingPeriodStartDate:
                  type: string
                  description: The first accounting period start date
                  format: YYYY-MM-DD
                  example: '2019-09-30'
                firstAccountingPeriodEndDate:
                  type: string
                  description: The first accounting period end date
                  format: YYYY-MM-DD
                  example: '2020-02-29'
                latencyDetails:
                  type: object
                  description: Income source latency details
                  properties:
                    latencyEndDate:
                      type: string
                      description: End date of latency period for the income source.
                      example: '2020-02-27'
                      format: YYYY-MM-DD
                    taxYear1:
                      type: string
                      description: First tax year for the income source.
                      example: 2018-19
                      format: YYYY-YY
                      minimum: 7
                      maximum: 7
                    latencyIndicator1:
                      type: string
                      description: Self assessment submission frequency ('A' - Annual, 'Q' - Quarterly).
                      enum:
                        - A
                        - Q
                      example: A
                    taxYear2:
                      type: string
                      description: Second tax year for the income source.
                      example: 2019-20
                      format: YYYY-YY
                      minimum: 7
                      maximum: 7
                    latencyIndicator2:
                      type: string
                      description: Self assessment submission frequency ('A' - Annual, 'Q' - Quarterly).
                      enum:
                        - A
                        - Q
                      example: A
                  required:
                    - latencyEndDate
                    - taxYear1
                    - latencyIndicator1
                    - taxYear2
                    - latencyIndicator2
                quarterlyTypeChoice:
                  type: object
                  description: Quarterly reporting period type
                  properties:
                    quarterlyPeriodType:
                      description: The quarterly period type that is being chosen for the business ID.
                      type: string
                      enum:
                        - standard
                        - calendar
                    taxYearOfChoice:
                      description: The tax year for which the quarterly period type was chosen.
                      type: string
                      format: ^2[0-9]{3}-[0-9]{2}$
                accountingType:
                  description: CASH if you used the cash basis, money actually received and paid out, to calculate your income and expenses. Otherwise ACCRUALS.
                  type: string
                  enum:
                    - CASH
                    - ACCRUALS
                commencementDate:
                  description: Business start date, must be in the past.
                  type: string
                  format: YYYY-MM-DD
                  example: '2016-09-24'
                cessationDate:
                  description: Business cessation date.
                  type: string
                  format: YYYY-MM-DD
                  example: '2020-03-24'
                businessAddressLineOne:
                  description: |-
                    First line of the business address.

                    Forbidden for property businesses.

                    Mandatory for self-employment businesses.
                  type: string
                  maximum: 35
                  example: 1 ABC Rd.
                businessAddressLineTwo:
                  description: |-
                    Second line of the business address.

                    Forbidden for property businesses.
                  type: string
                  maximum: 35
                  example: London
                businessAddressLineThree:
                  description: |-
                    Third line of the business address.

                    Forbidden for property businesses.
                  type: string
                  maximum: 35
                  example: Greater London
                businessAddressLineFour:
                  description: |-
                    Fourth line of the business address.

                    Forbidden for property businesses.
                  type: string
                  maximum: 35
                  example: United Kingdom
                businessAddressPostcode:
                  description: |-
                    Business postcode.

                    Forbidden for property businesses.

                    Mandatory for self-employment businesses if businessAddressCountryCode "GB" is provided.
                  pattern: ^[A-Z]{1,2}[0-9][0-9A-Z]?\s?[0-9][A-Z]{2}|BFPO\s?[0-9]{1,10}$
                  type: string
                  example: M1 1AG
                businessAddressCountryCode:
                  description: |-
                    The two letter code for a country must adhere to ISO 3166.

                    Forbidden for property businesses.

                    Mandatory for self-employment businesses.
                  type: string
                  example: GB
              required:
                - typeOfBusiness
              additionalProperties: false
            examples:
              uk-property-request:
                description: Create a UK property request
                value:
                  $ref: ./examples/businesses/create_request_uk_property.json
              foreign-property-request:
                description: Create a foreign property request
                value:
                  $ref: ./examples/businesses/create_request_foreign_property.json
              self-employment-business-request:
                description: Create a self employment business request
                value:
                  $ref: ./examples/businesses/create_request_self_employment_business.json
      responses:
        '201':
          description: Success
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                $schema: http://json-schema.org/draft-04/schema#
                title: Create a Test Business
                type: object
                properties:
                  businessId:
                    type: string
                    description: A unique identifier for the business income source.
                    pattern: ^X[A-Z0-9]{1}IS[0-9]{11}$
                additionalProperties: false
              examples:
                example-response:
                  description: Example Response
                  value:
                    $ref: ./examples/businesses/create_response.json
        '400':
          description: Bad request
          headers:
            X-CorrelationId:
              name: X-CorrelationId
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
          content:
            application/json:
              schema:
                description: Error Response
                type: object
                properties: *ref_1
                required: *ref_2
              examples:
                FORMAT_NINO:
